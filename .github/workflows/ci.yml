
name: SenGuichet - Lab 2 CI

on:
  push:
    branches:
      - feature/ci-lab2
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Executer les tests
        working-directory: senguichet/backend
        run: mvn test

  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Construire le JAR
        working-directory: senguichet/backend
        run: mvn package -DskipTests

      - name: Archiver le JAR
        uses: actions/upload-artifact@v4
        with:
          name: senguichet-backend-jar
          path: senguichet/backend/target/*.jar
          retention-days: 1


  build-image:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: build-jar

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        working-directory: senguichet/backend
        run: |
          docker build -t senguichet-backend:${GITHUB_SHA::7} .

      - name: Afficher le resultat
        run: |
          echo "Image construite : senguichet-backend:${GITHUB_SHA::7}"

      - name: Verifier l'image
        run: docker images
