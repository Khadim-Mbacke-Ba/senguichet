
# Pipeline SenGuichet : tests du backend

name: Tests du backend SenGuichet

on:
  push:
    branches:
      - main
      - feature/ci-hello

  pull_request:
    branches:
      - main

jobs:
  test-backend:
    name: Tests du backend
    runs-on: ubuntu-latest

    steps:
      # Récupération du code source
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Installation de Java 17
      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Exécution des tests Maven
      - name: Lancer les tests du backend
        working-directory: backend
        run: mvn test
