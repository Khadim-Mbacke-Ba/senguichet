
name: Mon premier pipeline SenGuichet

on:
  push:
    branches:
      - main
      - feature/ci-hello

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Afficher un message
        run: |
          echo "Bonjour depuis le pipeline SenGuichet !"
          echo "Ce job tourne sur GitHub Actions."

  test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Test de la variable secrète
        run: |
          echo "Test de la variable secrète"
          echo "$MA_VARIABLE_SECRETE"